# Pipeline configuration. Paths are relative to the repository root.
# Every methodological choice here is explained in docs/methods.md.

paths:
  pbf: data/raw/berlin-latest.osm.pbf
  gtfs: data/raw/GTFS.zip
  districts: data/bezirksgrenzen.geojson
  derived: data/derived      # large intermediate files, git-ignored
  output: output             # small CSV/JSON results, committed

downloads:
  pbf_url: https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
  gtfs_url: https://www.vbb.de/vbbgtfs

district_name_column: spatial_alias
crs: EPSG:32633              # UTM 33N, metres

walk_speed_main_mps: 1.3
walk_speeds_mps: [1.0, 1.3, 1.4]
share_thresholds_min: [15, 30]

stop_buffer_m: 1000          # stops up to this far outside Berlin are kept
max_stop_snap_m: 250         # stops further than this from the walk network are dropped
max_building_snap_m: 250     # buildings further than this from the walk network are flagged and excluded

modes: [S-Bahn, U-Bahn, Tram, Bus, Regionalbahn]
